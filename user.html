<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users &amp; Cashier Terminal Bindings</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./js/page-auth.js?v=20261101"></script>
    <script type="module" src="./js/user.js?v=20261101"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">POS &amp; AR Master Files</a>
      </div>
    </nav>
    <div class="container mt-4">
      <div id="header-div" class="d-flex justify-content-between align-items-center">
        <h1 id="header-text">USERS &amp; TERMINAL BINDINGS</h1>
        <button type="button" class="btn btn-primary" id="btn-add" data-bs-toggle="modal" data-bs-target="#blank-modal">Add User</button>
      </div>
      <p class="text-muted">Admin manages employee accounts and binds Cashier accounts to their assigned POS Terminal. Supervisors, Admins, and Managers are exempt from terminal locks.</p>
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <input
            type="search"
            id="user-search-filter"
            class="form-control form-control-sm"
            placeholder="Search users by username, name, role, or assigned terminal..."
            aria-label="Search users"
          />
        </div>
      </div>
      <div id="users-error" class="alert alert-danger d-none" role="alert"></div>
      <div id="main-div"></div>
      <div id="table-div" class="mt-3"></div>
      <div id="footer-div"></div>
    </div>

    <!-- BLANK MODAL -->
    <div class="modal fade" id="blank-modal" role="modal">
      <div class="modal-dialog modal-md">
        <div class="modal-content">
          <div class="modal-header text-white" style="background-color:#006400">
            <h5 class="modal-title" id="blank-modal-title">Add User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="blank-modal-body">
            <form id="add-form">
              <div class="row g-2" id="blank-main-div" style="padding:5px;">
                <div class="col-md-6"><input type="text" class="form-control" id="username" placeholder="Username" maxlength="50" required /></div>
                <div class="col-md-6"><input type="text" class="form-control" id="first_name" placeholder="First Name" maxlength="50" required /></div>
                <div class="col-md-6"><input type="text" class="form-control" id="last_name" placeholder="Last Name" maxlength="50" required /></div>
                <div class="col-md-6">
                  <select class="form-select" id="role_id" required>
                    <option value="">-- SELECT ROLE --</option>
                  </select>
                </div>
                <div class="col-md-12">
                  <label class="form-label small fw-bold mb-1" for="assigned_terminal_id">Assigned POS Terminal (Required for Cashiers)</label>
                  <select class="form-select" id="assigned_terminal_id">
                    <option value="">-- Exempt / Unassigned --</option>
                  </select>
                </div>
                <div class="col-md-6"><input type="text" class="form-control" id="email" placeholder="Email" maxlength="100" /></div>
                <div class="col-md-6"><input type="text" class="form-control" id="phone" placeholder="Phone" maxlength="30" /></div>
                <div class="col-md-12"><input type="password" class="form-control" id="password" placeholder="Password (minimum 8 characters)" minlength="8" required /></div>
              </div>
            </form>
          </div>
          <div class="modal-footer" id="blank-modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary" id="btn-submit" form="add-form">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
