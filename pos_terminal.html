<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Terminals &amp; Workstation Registry</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./js/page-auth.js?v=20261101"></script>
    <script type="module" src="./js/pos_terminal.js?v=20261101"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">POS &amp; AR Master Files</a>
      </div>
    </nav>
    <div class="container mt-4">
      <div id="header-div" class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <h1 id="header-text" class="mb-1">POS TERMINALS &amp; WORKSTATION REGISTRY</h1>
          <p class="text-muted mb-0">
            Server-side terminal registry maps machine identifiers / device tokens to POS terminals. Cashiers are auto-assigned and locked to their bound terminal at login.
          </p>
        </div>
        <button type="button" class="btn btn-primary d-none" id="btn-add" data-bs-toggle="modal" data-bs-target="#blank-modal">Add Terminal</button>
      </div>

      <div class="row g-2 align-items-center mt-3">
        <div class="col-md-6">
          <input
            type="search"
            id="terminal-search-filter"
            class="form-control form-control-sm"
            placeholder="Search terminals by name, machine ID, token, or IP..."
            aria-label="Search POS terminals"
          />
        </div>
        <div class="col-md-6 text-md-end small text-muted font-monospace" id="current-browser-binding-info">
          Detecting current browser workstation binding...
        </div>
      </div>

      <div id="main-div"></div>
      <div id="terminal-error" class="alert alert-danger d-none mt-3" role="alert"></div>
      <div id="table-div" class="mt-3"></div>
      <div id="footer-div"></div>
    </div>

    <!-- BLANK MODAL -->
    <div class="modal fade" id="blank-modal" role="dialog" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-md">
        <div class="modal-content">
          <div class="modal-header text-white" style="background-color:#006400">
            <h5 class="modal-title" id="blank-modal-title">Add POS Terminal</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="blank-modal-body">
            <form id="add-form">
              <div class="row g-2" id="blank-main-div" style="padding:5px;">
                <div class="col-md-12">
                  <label class="form-label small fw-bold mb-1" for="terminal_name">Terminal Name *</label>
                  <input type="text" class="form-control" id="terminal_name" placeholder="e.g. Counter 1" maxlength="150" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold mb-1" for="machine_identifier">Machine Identifier</label>
                  <input type="text" class="form-control font-monospace" id="machine_identifier" placeholder="e.g. TERM-01" maxlength="150" />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold mb-1" for="device_token">Device Token</label>
                  <input type="text" class="form-control font-monospace" id="device_token" placeholder="e.g. TOKEN-TERM-1" maxlength="150" />
                </div>
                <div class="col-md-12">
                  <label class="form-label small fw-bold mb-1" for="ip_address">Workstation IP Address</label>
                  <input type="text" class="form-control font-monospace" id="ip_address" placeholder="e.g. 127.0.0.1 or 192.168.1.101" maxlength="64" />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer" id="blank-modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary" id="btn-submit" form="add-form">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
